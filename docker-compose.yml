services:
  postgres:
    image: postgres:16-alpine
    container_name: digicolony-client-ops-postgres
    environment:
      POSTGRES_DB: digicolony_client_ops
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d digicolony_client_ops"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
